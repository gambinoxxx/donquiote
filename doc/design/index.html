<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>Sign in · DG Signals</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell" style="padding: 72px 24px 40px; gap: 40px;">
  <div style="display: flex; flex-direction: column; gap: 20px;">
    <span style="width: 56px; height: 56px; border-radius: 16px; background: var(--accent-primary); display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="var(--accent-on)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 4 7-9"/><path d="M15 6h4v4"/></svg>
    </span>
    <div>
      <h1 class="title" style="font-size: 30px;">DG Signals</h1>
      <p class="muted" style="margin-top: 8px; font-size: 16px; line-height: 1.5;">Your setups, caught for you. Sign in to see your alerts and risk guard.</p>
    </div>
  </div>

  <!-- Step 1: email. Step 2: code. Clerk handles both; only emails in ALLOWED_EMAILS get in. -->
  <form id="signin" style="display: flex; flex-direction: column; gap: 20px;" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="field" id="code-field" hidden>
      <label for="code">6-digit code</label>
      <input id="code" class="input mono" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="font-size: 20px; letter-spacing: 0.3em;">
      <p class="muted" style="font-size: 13px;">We sent a code to your email. <a href="#" id="resend" style="text-decoration: none; font-weight: 500;">Resend</a></p>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="submit">Send code</button>
    <p id="err" role="alert" style="color: var(--state-error); font-size: 14px;" hidden>This email isn't allowed to use DG Signals.</p>
  </form>

  <p class="muted" style="margin-top: auto; font-size: 13px; text-align: center; line-height: 1.5;">Private app for two people. Alerts check DG's rules; they are not trade advice.</p>
</main>
<script src="app.js"></script>
<script>
  const form = document.getElementById("signin");
  let step = 1;
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (step === 1) {
      document.getElementById("code-field").hidden = false;
      document.getElementById("submit").textContent = "Sign in";
      document.getElementById("code").focus();
      step = 2;
    } else {
      location.href = "overview.html";
    }
  });
  document.getElementById("resend").addEventListener("click", (e) => { e.preventDefault(); toast("New code sent"); });
</script>
</body>
</html>
